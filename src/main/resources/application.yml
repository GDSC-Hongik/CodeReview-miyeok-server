spring:
  datasource:
    url: jdbc:mysql://${DB_MYSQL_URL}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
#        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
  profiles:
    include: oauth


openai:
  secret-key: ${OPENAI_SECRET_KEY}
  url:
    prompt: https://api.openai.com/v1/chat/completions


jwt:
  secret: ${JWT_SECRET_KEY}
  token:
    access-expiration-time: 3600000
    refresh-expiration-time: 8640000